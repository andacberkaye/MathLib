[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mathlibtr"
version = "0.1.0"
authors = [
    {name = "Berkay"}
]
description = "Advanced Python math library featuring arithmetic, calculus, trigonometry, statistics, and matrix operations built from scratch."
readme = "README.md"
requires-python = ">=3.9"

license = {text = "MIT"}

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/andacberkaye/math-toolkit"